# Job mecamecanica_pipeline — cresce a cada entrega:
#   1. raw_conferencia          (feito) — confere a chegada dos CSVs no Volume bronze.raw
#   2. bronze_ingestao          (feito) — grava as 10 tabelas Delta da bronze, tudo STRING
#   3. silver_* (4 tarefas)     (feito) — limpa, tipa e declara o contrato das 10 tabelas silver, em paralelo
#   4. gold_dimensoes, gold_fato_vendas, gold_marts, testes
#                               (feito) — dimensões conformadas, fato_vendas, 3 marts e
#                               9 testes de qualidade que derrubam o job se falharem
#   5. dashboard comercial      (feito) — resources/dashboard.dashboard.yml, não é tarefa deste job
#   6. gold_metricas_negocio, gold_retorno_ligacao
#                               (feito) — 3 views de negócio (clientes_em_risco, ranking_marcas,
#                               receita_mensal) e a tabela de callback preenchida pelo app
#   7. ml_features, ml_modelo, ml_fila
#                               (feito) — camada de ML: features de propensão, treino/registro do
#                               modelo (HistGradientBoostingClassifier, MLflow/UC) e a fila semanal
#                               de 200 contatos com as 4 funções de apoio ao agente
resources:
  jobs:
    mecamecanica_pipeline:
      name: mecamecanica_pipeline
      tasks:
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: bronze_ingestao
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: silver_clientes
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/01-clientes.sql
              source: WORKSPACE
        - task_key: silver_pedidos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/02-pedidos.sql
              source: WORKSPACE
        - task_key: silver_itens_e_produtos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/03-itens-e-produtos.sql
              source: WORKSPACE
        - task_key: silver_crm_e_financeiro
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/04-crm-e-financeiro.sql
              source: WORKSPACE
        - task_key: gold_dimensoes
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_e_produtos
            - task_key: silver_crm_e_financeiro
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/05-dimensoes.sql
              source: WORKSPACE
        - task_key: gold_fato_vendas
          depends_on:
            - task_key: gold_dimensoes
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/06-fato-vendas.sql
              source: WORKSPACE
        - task_key: gold_marts
          depends_on:
            - task_key: gold_fato_vendas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/07-marts.sql
              source: WORKSPACE
        - task_key: testes
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/08-testes.sql
              source: WORKSPACE
        - task_key: gold_metricas_negocio
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/09-metricas-negocio.sql
              source: WORKSPACE
        - task_key: gold_retorno_ligacao
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/10-retorno-ligacao.sql
              source: WORKSPACE
        - task_key: ml_features
          depends_on:
            - task_key: testes
          notebook_task:
            notebook_path: ../src/ml/09-features.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: ml_modelo
          depends_on:
            - task_key: ml_features
          notebook_task:
            notebook_path: ../src/ml/10-modelo.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: ml_fila
          depends_on:
            - task_key: ml_modelo
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ml/11-fila.sql
              source: WORKSPACE
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
