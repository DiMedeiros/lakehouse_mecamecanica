# O Genie space como CÓDIGO.
#
# Este é o Genie de propósito geral (12 fontes, bronze/silver/gold) — o
# "fecha o arco" da aula-02, prompt 6. Diferente de genie_direcao (7 fontes,
# métrica lift_top200, nunca AUC) e genie_fila_semanal (a fila do vendedor):
# este responde qualquer pergunta de negócio sobre a gold inteira, para quem
# não tem um recorte fixo de audiência.
resources:
  genie_spaces:
    genie_comercial:
      title: "mecamecanica · Comercial"
      description: >-
        Perguntas de negócio sobre a gold da mecamecanica, em português.
        Sabe que o pico do setor de autopeças é o mês ANTERIOR à data
        comemorativa, e nunca chama dezembro/janeiro de mês ruim.
      file_path: ../src/genie_comercial.geniespace.json
      warehouse_id: ${var.warehouse_id}
