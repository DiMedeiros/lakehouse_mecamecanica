# This is a Declarative Automation Bundle definition for mecamecanica.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: mecamecanica
  uuid: 70908b66-404b-43a4-b10d-a9b82a3bba5a

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: >-
      SQL warehouse usado por scripts e futuras tarefas SQL do pipeline.
      Ainda não é consumido por nenhum recurso nesta entrega — fica pronto
      para os próximos incrementos.
    lookup:
      warehouse: "Serverless Starter Warehouse"

targets:
  dev:
    # NÃO usar 'mode: development' aqui: ele prefixaria os recursos com
    # '[dev meu_usuario]' — inclusive os SCHEMAS do Unity Catalog, que
    # virariam algo como 'dev_fulano_bronze' e quebrariam todo o SQL fixo
    # que as próximas entregas do curso referenciam como 'bronze'/'silver'/
    # 'gold'. Em vez disso, pausamos o agendamento explicitamente.
    default: true
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-22b95d29-e938.cloud.databricks.com
    variables:
      catalog: lakehouse_mecamecanica
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-22b95d29-e938.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/diego.smedeiros@live.com to make sure we only have a single copy.
      root_path: /Workspace/Users/diego.smedeiros@live.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakehouse_mecamecanica
      schema: prod
    permissions:
      - user_name: diego.smedeiros@live.com
        level: CAN_MANAGE
